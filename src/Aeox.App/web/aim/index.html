<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>aeox aim</title>
  <link rel="stylesheet" href="aim.css">
  <script type="importmap">
    { "imports": { "three": "./vendor/three/build/three.module.min.js" } }
  </script>
</head>
<body>
  <canvas id="scene"></canvas>

  <header class="bar" id="bar">
    <div class="brand"><b>AEOX</b><span>aim trainer</span></div>
    <div class="stats">
      <div class="cell" id="timer">00:00</div>
      <div class="cell" id="acc">--</div>
      <div class="win">
        <button data-win="min" title="minimize">&#8211;</button>
        <button data-win="max" title="maximize">&#9633;</button>
        <button data-win="close" title="close">&#10005;</button>
      </div>
    </div>
  </header>

  <div class="crosshair" id="crosshair"><i></i><i></i><i></i><i></i></div>
  <p class="corner left" id="mapLabel"></p>
  <p class="corner right" id="hint">esc pause</p>

  <section class="menu" id="menu">
    <div class="col">
      <p class="label">your game</p>
      <div class="field">
        <span>game</span>
        <select id="game"></select>
      </div>
      <div class="field">
        <span id="sensLabel">sensitivity</span>
        <input id="sens" type="text" inputmode="decimal" spellcheck="false">
      </div>
      <div class="field" id="cmRow">
        <span>cm / 360</span>
        <input id="cm360" type="text" inputmode="decimal" spellcheck="false">
      </div>
      <div class="field">
        <span>fov</span>
        <input id="fov" type="text" inputmode="decimal" spellcheck="false">
      </div>
      <div class="field">
        <span>mouse dpi</span>
        <input id="dpi" type="text" inputmode="decimal" spellcheck="false">
      </div>
      <p class="readout" id="readout"></p>
      <p class="note" id="source"></p>
    </div>

    <div class="col wide">
      <p class="label">maps</p>
      <div class="maps" id="maps"></div>
      <p class="label" id="myLabel">my maps</p>
      <div class="maps" id="myMaps"></div>
    </div>

    <div class="col">
      <p class="label">weak spots</p>
      <div id="weak"></div>
      <button class="primary" id="build">build my map</button>
      <p class="note" id="buildNote"></p>
      <p class="label gap">last runs</p>
      <ul class="runs" id="runs"></ul>
    </div>
  </section>

  <section class="sheet" id="builder" hidden>
    <div class="sheet-body">
      <p class="label">map builder</p>
      <input id="mapName" class="name" maxlength="40">
      <div class="grid2" id="builderFields"></div>
      <div class="row">
        <button class="primary" id="saveMap">save and play</button>
        <button id="deleteMap">delete</button>
        <button id="closeBuilder">cancel</button>
      </div>
    </div>
  </section>

  <section class="sheet" id="gate" hidden>
    <div class="sheet-body center">
      <p class="big" id="gateTitle"></p>
      <p class="note" id="gateNote">click to start. your mouse is captured until you press esc.</p>
    </div>
  </section>

  <section class="sheet" id="pause" hidden>
    <div class="sheet-body center">
      <p class="big">paused</p>
      <div class="row">
        <button class="primary" id="resume">resume</button>
        <button id="restart">restart</button>
        <button id="quit">menu</button>
      </div>
    </div>
  </section>

  <section class="sheet" id="results" hidden>
    <div class="sheet-body">
      <p class="label" id="resMap"></p>
      <p class="score" id="resScore"></p>
      <div class="kv" id="resStats"></div>
      <div id="resWeak"></div>
      <div class="row">
        <button class="primary" id="again">again</button>
        <button id="trainWeak">train weak spots</button>
        <button id="toMenu">menu</button>
      </div>
    </div>
  </section>

  <script type="module" src="aim.js"></script>
</body>
</html>
